services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teatro
      POSTGRES_USER: teatro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD antes de iniciar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - teatro_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teatro -d teatro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teatro_dados:
