<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Detalhes da sessão')}"></head>
<body>
<header th:replace="~{layout/base :: header}"></header>
<main class="mx-auto max-w-3xl px-5 pt-10 sm:px-8">
    <a class="text-sm text-slate-500 hover:underline" th:href="@{/sessoes}">← Voltar para sessões</a>
    <div class="mt-7 mb-7"><p class="eyebrow" th:text="|SESSÃO #${sessao.codigo}|"></p><h1 class="page-title" th:text="${sessao.nomePeca}"></h1></div>
    <div th:replace="~{layout/base :: avisos}"></div>
    <div class="rounded-2xl border border-slate-200 bg-white p-6 sm:p-8">
        <dl class="grid gap-7 sm:grid-cols-2">
            <div><dt class="label">Data</dt><dd class="text-xl font-medium text-noite" th:text="${#temporals.format(sessao.data, 'dd/MM/yyyy')}"></dd></div>
            <div><dt class="label">Horário</dt><dd class="text-xl font-medium text-noite" th:text="${#temporals.format(sessao.horario, 'HH:mm')}"></dd></div>
            <div class="sm:col-span-2"><dt class="label">Local</dt><dd class="text-lg text-noite" th:text="${sessao.local}"></dd></div>
            <div><dt class="label">Capacidade</dt><dd class="text-lg text-noite" th:text="|${sessao.capacidade} espectadores|"></dd></div>
            <div><dt class="label">Valor do ingresso</dt><dd class="text-lg text-noite" th:text="|R$ ${#numbers.formatDecimal(sessao.valor, 1, 'POINT', 2, 'COMMA')}|"></dd></div>
        </dl>
        <div class="mt-8 flex flex-wrap items-center gap-4 border-t border-slate-100 pt-6">
            <a class="btn btn-primary" th:href="@{/sessoes/{id}/editar(id=${sessao.codigo})}">Editar sessão</a>
            <form method="post" th:action="@{/sessoes/{id}/excluir(id=${sessao.codigo})}" data-confirm="Excluir esta sessão? Esta ação não pode ser desfeita."><button class="btn btn-secondary" type="submit">Excluir sessão</button></form>
        </div>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
