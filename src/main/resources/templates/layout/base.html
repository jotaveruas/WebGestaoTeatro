<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"]}'>
    <title th:text="${titulo} + ' | Gestão de Teatro'">Gestão de Teatro</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/vendors/htmx.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<header th:fragment="header" class="bg-noite text-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-6 px-5 py-5 sm:px-8">
        <a th:href="@{/sessoes}" class="flex items-center gap-3" aria-label="Gestão de Teatro, início">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/30 font-serif text-xl" aria-hidden="true">T</span>
            <span><span class="block text-lg font-semibold tracking-wide">Gestão de Teatro</span><span class="block text-xs text-slate-300">Programação e sessões</span></span>
        </a>
        <nav aria-label="Menu principal"><a class="text-sm text-white underline decoration-white/40 underline-offset-8" th:href="@{/sessoes}">Sessões</a></nav>
    </div>
</header>
<div th:fragment="avisos" aria-live="polite">
    <p th:if="${sucesso}" th:text="${sucesso}" role="status" class="mb-5 rounded-xl border border-emerald-200 bg-emerald-50 px-5 py-4 text-sm text-emerald-900"></p>
    <p th:if="${erro}" th:text="${erro}" role="alert" class="mb-5 rounded-xl border border-rose-200 bg-rose-50 px-5 py-4 text-sm text-rose-900"></p>
</div>
<footer th:fragment="footer" class="mx-auto mt-12 max-w-6xl border-t border-slate-200 px-5 py-6 text-xs text-slate-500 sm:px-8">
    Sistema de Gestão de Teatro
    <dialog id="confirmacao-exclusao" class="m-auto max-w-md rounded-2xl border border-slate-200 bg-white p-7 text-base text-slate-800 shadow-xl" aria-labelledby="confirmacao-titulo">
        <h2 id="confirmacao-titulo" class="text-xl font-semibold text-noite">Excluir sessão?</h2>
        <p id="confirmacao-mensagem" class="mt-3 text-sm leading-relaxed text-slate-600"></p>
        <form method="dialog" class="mt-6 flex flex-wrap justify-end gap-3">
            <button class="btn btn-secondary" value="cancelar" type="submit" autofocus>Cancelar</button>
            <button class="btn btn-primary" value="excluir" type="submit">Confirmar exclusão</button>
        </form>
    </dialog>
</footer>
</body>
</html>
